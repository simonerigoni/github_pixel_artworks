[project]
name = "github-pixel-artworks"
version = "0.1.0"
description = "Create pixel artworks in your GitHub contributions chart."
readme = "README.md"
requires-python = ">=3.15"
license = "GPL-3.0-or-later"
license-files = ["LICENSE.md"]
authors = [{ name = "Simone Rigoni" }]
dependencies = ["GitPython>=3.1.0"]


[project.urls]
Repository = "https://github.com/simonerigoni/github_pixel_artworks"

[dependency-groups]
dev = [
    "pyright>=1.1.408",
    "pytest-cov>=7.1.0",
    "ruff>=0.14.6",
]

[project.scripts]
github-pixel-artworks = "github_pixel_artworks.cli:cli"
github-pixel-artworks-gui = "github_pixel_artworks.gui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# pycodestyle/pyflakes defaults plus import sorting (I), pyupgrade (UP), and flake8-bugbear (B)
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v --durations=0"

[tool.coverage.run]
source = ["src"]